name: V8 frozen M1 M2 five native estimators
on:
  push:
    branches: [pilot/v8-native-five-20261124]
    paths:
      - 'pilot/v8_native_five/generate.py'
      - 'pilot/v8_native_five/native.R'
      - 'pilot/v8_native_five/analyze.py'
      - '.github/workflows/v8-native-five-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        method: [ITR]
        first_rep: [10]
        mechanism: [M2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/v8-native-five-20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Install data generator
        run: python -m pip install --disable-pip-version-check numpy
      - name: Reproduce exactly original paired training and test cohorts
        run: python pilot/v8_native_five/generate.py 20
      - name: Install exact R method
        env:
          METHOD: ${{ matrix.method }}
        run: |
          set -e
          if [ "$METHOD" = PMCR ]; then
            Rscript -e 'install.packages(c("rgenoud","rpart"),repos=Sys.getenv("RSPM","https://cloud.r-project.org"),Ncpus=2)'
            curl -fsSL https://raw.githubusercontent.com/JieraZhou/PMCRcode/1ddbf813cb95473befbd7c43378c86cb2ee124ee/PMCRfun.R -o pilot/v8_native_five/PMCRfun.R
          elif [ "$METHOD" = DTR ]; then
            Rscript -e 'install.packages("dtrSurv",repos=Sys.getenv("RSPM","https://cloud.r-project.org"),Ncpus=2)'
          elif [ "$METHOD" = RSF ]; then
            sudo apt-get update -qq
            sudo apt-get install -y libuv1-dev
            Rscript -e 'install.packages("randomForestSRC",repos=Sys.getenv("RSPM","https://cloud.r-project.org"),Ncpus=2)'
          elif [ "$METHOD" = ITR ]; then
            Rscript -e 'install.packages(c("dplyr","tidyr","purrr","reshape2"),repos=Sys.getenv("RSPM","https://cloud.r-project.org"),Ncpus=2)'
            git clone --depth 1 https://github.com/cwzhou/itrSurv.git /tmp/itrSurv
            find /tmp/itrSurv/src -maxdepth 1 -type f \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -delete
            R CMD INSTALL /tmp/itrSurv
          fi
      - name: Fit published native method on paired M1/M2
        env:
          METHOD: ${{ matrix.method }}
        run: |
          mkdir -p pilot/v8_native_five/results
          set -o pipefail
          timeout 3400s Rscript pilot/v8_native_five/native.R "$METHOD" 20 ${{ matrix.first_rep }} ${{ matrix.first_rep }} ${{ matrix.mechanism }} 2>&1 | tee "pilot/v8_native_five/results/log_$METHOD.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-native-${{ matrix.method }}-r${{ matrix.first_rep }}-${{ matrix.mechanism }}
          path: pilot/v8_native_five/results/**
          retention-days: 30
  collect:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pilot/v8-native-five-20261124
      - uses: actions/download-artifact@v4
        with:
          pattern: v8-native-*
          path: pilot/v8_native_five/results/
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoring dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Joint true-risk evaluation on exactly matched patients
        run: python pilot/v8_native_five/analyze_native.py 20
      - name: Commit output files to isolated pilot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilot/v8_native_five/results/
          if ! git diff --staged --quiet; then
            git commit -m "pilot: 20-rep native R decisions and independent oracle scoring"
            git pull --rebase origin pilot/v8-native-five-20261124
            git pull --rebase origin pilot/v8-native-five-20261124
            git push origin HEAD:pilot/v8-native-five-20261124
          fi
